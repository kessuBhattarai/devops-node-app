apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-node-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-node-app

  template:
    metadata:
      labels:
        app: devops-node-app

    spec:
      containers:
        - name: node-app

          image: 373078100057.dkr.ecr.ap-southeast-1.amazonaws.com/devops-node-app:v1

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
